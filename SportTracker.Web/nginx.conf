server {
    listen 80;

    # The bundle is ~1.6 MB of JavaScript: send it compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/plain;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
